<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>study-app</title>
</head>

<body>
  <div id="app"></div>
  <input id="task-input" type="text" maxlength="20" style="
  position: absolute;
  display: none;
  font-size: 12px;
  width: 70px;
  height: 7px;
  z-index: 10;
" />
  <div id="task-list-overlay" style="
  position: absolute;
  display: none;
  pointer-events: none;
  z-index: 5;
"></div>
  <div id="pick-time-overlay" style="
  position: absolute;
  display: none;
  z-index: 20;
"></div>
<div id="completed-session-overlay" style="
  position: absolute;
  display: none;
  z-index: 100;
"></div>
<div id="auth-overlay" style="
  position: absolute;
  display: none;
  z-index: 2000;
  pointer-events: auto;
"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
